# csm-panel configuration.
# Copy to ~/.config/csm-panel/config.toml (or /etc/csm-panel/config.toml) and edit.

[panel]
port = "/dev/ttyACM0"    # the panel's serial device

# A compiled theme blob to flash ONCE at startup (see `csm-panel ui-compile`).
# The panel resets on a full-frame flash, so we flash once and then only stream
# value updates (0x66), which never reset it. Omit to drive whatever theme is
# already on the panel.
theme = "theme.bin"

interval = 10.0          # seconds between 0x66 pushes (keep < 30 so the panel stays awake)
brightness = 100         # 0..100

# --- provider ---
# The only data hook. Each interval the service runs this command and expects a
# JSON object {field_id: value} on stdout, e.g. {"2": 45, "3": 46, ...}. Valid
# field ids are 2..21 (they map to the widgets you bound in the theme). Where the
# values come from is entirely up to your provider.
[provider]
command = "python examples/provider_stub.py"
